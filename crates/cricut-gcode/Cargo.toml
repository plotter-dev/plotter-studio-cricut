[package]
name = "cricut-gcode"
description = "Drive a Cricut Explore Air 2 from G-code: parses G-code and streams the machine's native (encrypted) cut protocol, with async state and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
# The async controller and the serial transport. Without it the crate is only the protocol, the
# job encoding and the blocking `engine`, which build for WebAssembly (the device plugin).
runtime = ["dep:tokio", "dep:tokio-serial", "dep:tokio-util", "dep:rand", "dep:tracing"]

[dependencies]
aes.workspace = true
gcode.workspace = true
lyon_geom.workspace = true
rand = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"], optional = true }
tokio-serial = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "signal"] }

[lints]
workspace = true
