name: CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .cargo/**
      - crates/**
      - plugin/**
      - wit/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - clippy.toml
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: rustup toolchain install
      - run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p cricut-plugin --target wasm32-wasip2 --release --locked
      - run: cargo xtask package

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package
      - name: Define release metadata
        id: release
        shell: bash
        run: |
          version="$(jq -r '.version' plugin/manifest.json)"
          echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=Cricut plugin v${version} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          target/packages/cricut.psdevice
          --target "${{ github.sha }}"
          --title "${{ steps.release.outputs.title }}"
          --generate-notes
