# Clippy configuration. Lint *levels* live in [workspace.lints] in Cargo.toml.
# `msrv` is read from `rust-version` in Cargo.toml automatically.

# Tests may unwrap/expect freely: a panic is exactly how a test should fail.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

