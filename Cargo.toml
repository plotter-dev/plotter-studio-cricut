# Workspace for the Cricut Explore Air 2 device plugin: the protocol library, a hardware test
# harness and the WebAssembly plugin itself. `host-tests/` is a separate workspace because it
# needs a checkout of the host application (see its Cargo.toml).
[workspace]
resolver = "3"
members = ["crates/*", "plugin", "xtask"]
exclude = ["host-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
cricut-gcode = { path = "crates/cricut-gcode", default-features = false }
aes = "0.8"
gcode = { version = "0.7", default-features = false, features = ["alloc"] }
lyon_geom = "1"
rand = "0.8"
thiserror = "2"
tokio = "1"
tokio-serial = "5.4"
tokio-util = "0.7"
tracing = "0.1"
anyhow = "1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
